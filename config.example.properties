# FreeTV settings. install.sh copies this file to config.properties the first time; edit THAT one (it never leaves
# your computer: it is in .gitignore). After a change, run ./install.sh <TV IP> again.

# Free key from https://www.themoviedb.org/settings/api ("API Key"). It is yours and secret: paste it here yourself,
# never in a chat and never in a public place. Without it everything works, just without the film and series picks.
tmdb_key=

# Your country (two letters): decides which titles are on which streaming app. ES, MX, AR, CO, US, GB, DE, FR...
tmdb_region=ES

# Your city, for the weather and for the sunset that turns the home screen dark at night (decimal degrees).
# Look yours up on any map: for Seville they are 37.3891 and -5.9845.
latitude=40.4168
longitude=-3.7038
# The name shown on the weather card (empty = "Weather").
city=

# true leaves cartoons and anime out of the picks.
hide_animation=false

# auto (follows the TV), or en, es, pt, de, ru
language=auto

# true shows crypto prices (Binance) and the S&P 500 and NASDAQ 100 iShares funds on the home screen (both in dollars).
show_crypto=true

# Currency of the crypto prices: USD, EUR, BRL... (the two funds are always in dollars)
currency=USD

# C, F, or auto
temperature=C

# Streaming services to leave out of the picks, comma separated, for apps you have on the TV but no account in:
# netflix, prime, disney, hulu, paramount, peacock, globoplay, max, appletv, hotstar, crunchyroll.
# You can also switch them on and off on the TV (Home Settings, "Recommend from ..."), which wins over this.
hide_services=
