# FreeTV's Store on Android TV: once a day (and when its sources change) the catalog is made again from each app's newest GitHub
# release, every APK checked with aapt2 and its SHA-256 pinned (tools/android_catalog.py). When something changed, catalog.json is
# committed to main; the TVs read it from there (raw.githubusercontent.com), so no FreeTV release is needed. LG and Samsung are not
# touched: the version does not change.
name: android-catalog
on:
  schedule:
    - cron: '23 5 * * *'
  push:
    branches: [main]
    paths: ['android/catalog-sources.json', 'tools/android_catalog.py', '.github/workflows/android-catalog.yml']
  workflow_dispatch:
permissions:
  contents: write
concurrency: android-catalog
jobs:
  catalog:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.11' }
      - name: The catalog, checked app by app
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "build-tools;34.0.0" > /dev/null
          python3 tools/android_catalog.py | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Commit it when it changed
        run: |
          if git diff --quiet -- android/catalog.json; then echo "No change" | tee -a "$GITHUB_STEP_SUMMARY"; exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add android/catalog.json
          git commit -m "Android TV Store: catalog updated (newest releases, SHA-256 pinned)"
          git pull --rebase origin main && git push origin HEAD:main
