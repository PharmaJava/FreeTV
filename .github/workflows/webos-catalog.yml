# FreeTV's Store on LG: once a day (and when its maker changes) the most starred webOS apps on GitHub are looked up again, each
# package downloaded and read (its id, version, name and icon), its SHA-256 pinned (tools/webos_catalog.py). When something changed,
# webos/catalog.json and its icons are committed to main; the TVs read them from there (raw.githubusercontent.com), so no FreeTV
# release is needed for new apps or new versions.
name: webos-catalog
on:
  schedule:
    - cron: '41 4 * * *'
  push:
    branches: [main]
    paths: ['tools/webos_catalog.py', '.github/workflows/webos-catalog.yml']
  workflow_dispatch:
permissions:
  contents: write
concurrency: webos-catalog
jobs:
  catalog:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.11' }
      - name: The catalogue, app by app
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 tools/webos_catalog.py | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Commit it when it changed
        run: |
          if git diff --quiet -- webos/ && [ -z "$(git status --porcelain -- webos/)" ]; then echo "No change" | tee -a "$GITHUB_STEP_SUMMARY"; exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add webos/catalog.json webos/catalog-icons
          git commit -m "LG Store: the most starred webOS apps on GitHub, updated (SHA-256 pinned)"
          git pull --rebase origin main && git push origin HEAD:main
